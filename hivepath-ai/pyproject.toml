[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hivepath"
version = "1.0.0"
description = "Self-healing logistics route optimization with accessibility-aware planning"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "orjson>=3.10",
    "structlog>=24.2",
    "httpx>=0.27",
    "ortools>=9.12",
    "numpy>=1.26",
    "joblib>=1.4",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
# Torch is a large install and the service degrades gracefully without it,
# so the neural models are opt-in rather than a hard dependency.
ml = [
    "torch>=2.2",
    "torch-geometric>=2.5",
]
vlm = [
    "openai>=1.43",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
hivepath-api = "hivepath.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets the suite run straight from a clone, without an editable install first.
pythonpath = ["src"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]
addopts = "-q --strict-markers"
markers = [
    "integration: tests that require external network credentials",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
