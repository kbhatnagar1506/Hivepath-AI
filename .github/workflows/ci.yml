name: CI

on:
  push:
    branches: [main]
    paths:
      - "hivepath-ai/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "hivepath-ai/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch: {}

defaults:
  run:
    working-directory: hivepath-ai

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: hivepath-ai/pyproject.toml

      - name: Install package and dev dependencies
        run: pip install -e ".[dev]"

      # Verifies the service works with zero optional dependencies, matching
      # how it behaves for anyone who clones and runs it without extras.
      - name: Run test suite (no ML / vision extras)
        run: pytest -v

      - name: Import the app (no credentials, no extras)
        run: python -c "from hivepath.api.application import create_app; create_app()"

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: hivepath-ai/pyproject.toml

      - name: Install package, dev dependencies, and coverage
        run: pip install -e ".[dev]" coverage

      - name: Run tests under coverage
        run: coverage run --source=src/hivepath -m pytest

      - name: Report coverage
        run: coverage report --show-missing

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check src tests
